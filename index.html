<!DOCTYPE html>
<html>
<head>
  <title>ONNX Age Check FIXED</title>
</head>

<body style="text-align:center;font-family:Arial">

<h2>ONNX Age Check (Fixed)</h2>

<video id="video" autoplay playsinline width="320"></video>
<canvas id="canvas" width="224" height="224"></canvas>

<p id="status">Loading...</p>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<script>
let session;

async function loadModel() {
  ort.env.wasm.wasmPaths =
    "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

  session = await ort.InferenceSession.create("./model/age.onnx");

  console.log("Inputs:", session.inputNames);
  console.log("Outputs:", session.outputNames);

  document.getElementById("status").innerText = "Model loaded";
}

async function startCamera() {
  const video = document.getElementById("video");
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return video;
}

// FIXED preprocessing (NCHW)
function preprocess(video) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.drawImage(video, 0, 0, 224, 224);

  const img = ctx.getImageData(0, 0, 224, 224).data;

  const r = new Float32Array(224 * 224);
  const g = new Float32Array(224 * 224);
  const b = new Float32Array(224 * 224);

  let j = 0;
  for (let i = 0; i < img.length; i += 4) {
    r[j] = img[i] / 255;
    g[j] = img[i + 1] / 255;
    b[j] = img[i + 2] / 255;
    j++;
  }

  const input = new Float32Array([...r, ...g, ...b]);

  return new ort.Tensor("float32", input, [1, 3, 224, 224]);
}

async function run(video) {
  async function loop() {
    const tensor = preprocess(video);

    const inputName = session.inputNames[0];

    const results = await session.run({
      [inputName]: tensor
    });

    const outputName = session.outputNames[0];
    const out = results[outputName];

    const age = Array.from(out.data)[0];

    document.getElementById("status").innerText =
      "Estimated age: " + Math.round(age);

    requestAnimationFrame(loop);
  }

  loop();
}

(async () => {
  await loadModel();
  const video = await startCamera();
  run(video);
})();
</script>

</body>
</html>
