<!DOCTYPE html>
<html>
<head>
  <title>Private ONNX Age Check</title>
  <style>
    body { font-family: Arial; text-align: center; }
    video, canvas { width: 320px; height: 240px; }
  </style>
</head>

<body>

<h2>Private ONNX Age Verification (100% local)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="224" height="224"></canvas>

<p id="status">Loading...</p>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<script>
let session;

async function loadModel() {
  session = await ort.InferenceSession.create("./model/age.onnx", {
    executionProviders: ["wasm"]
  });

  document.getElementById("status").innerText = "Model loaded";
}

async function startCamera() {
  const video = document.getElementById("video");
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return video;
}

// simple resize + normalize
function preprocess(video, ctx) {
  ctx.drawImage(video, 0, 0, 224, 224);

  const imageData = ctx.getImageData(0, 0, 224, 224);
  const data = imageData.data;

  const input = new Float32Array(1 * 3 * 224 * 224);

  let i = 0;
  for (let p = 0; p < data.length; p += 4) {
    input[i]     = data[p] / 255.0;     // R
    input[i+1]   = data[p+1] / 255.0;   // G
    input[i+2]   = data[p+2] / 255.0;   // B
    i += 3;
  }

  return new ort.Tensor("float32", input, [1, 3, 224, 224]);
}

async function run(video) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  async function loop() {
    const inputTensor = preprocess(video, ctx);

    const results = await session.run({
      input: inputTensor
    });

    // assume model output: single float age
    const age = results.output.data[0];

    document.getElementById("status").innerText =
      "Estimated age: " + Math.round(age);

    // simple gating
    if (age >= 18) {
      document.body.style.background = "#d4ffd4";
    } else {
      document.body.style.background = "#ffd4d4";
    }

    requestAnimationFrame(loop);
  }

  loop();
}

(async () => {
  await loadModel();
  const video = await startCamera();
  run(video);
})();
</script>

</body>
</html>
